name: Build Ace5 UEFI + XNU loader

# 只做编译，不碰设备。产物是 .img，需要电脑用 fastboot 才能启动。
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-ace5-uefi.yml'
      - 'xnuloader/**'
      - 'uefi/**'
      - 'tools/ace5/**'
      - 'local/device/device.dtb'

permissions:
  contents: read

jobs:
  uefi:
    # ARM64 跑者：prepare-linux-arm64.py 明确拒绝非 aarch64 主机。
    # 注意：ubuntu-24.04-arm 仅对 public 仓库免费。
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    env:
      CLANGPDB_AARCH64_PREFIX: aarch64-linux-gnu-
      MU_PIN: 42fe563791e51bf5500c2e470ed294ca0c94b97c

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 腾空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          df -h /

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl xz-utils ca-certificates \
            clang-18 lld-18 llvm-18 \
            nasm python3 python3-venv python3-pip python3-yaml \
            uuid-dev gcc-aarch64-linux-gnu \
            device-tree-compiler acpica-tools
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      - name: 校验 DTB 已就位
        run: |
          DTB=local/device/device.dtb
          if [ ! -s "$DTB" ]; then
            echo "::error::$DTB 缺失，请把 Ace 5 的 DTB 提交到该路径后再运行"
            exit 1
          fi
          MAGIC=$(od -An -tx1 -N4 "$DTB" | tr -d ' \n')
          if [ "$MAGIC" != "d00dfeed" ]; then
            echo "::error::不是合法的 FDT/DTB（magic=$MAGIC）"
            exit 1
          fi
          ls -l "$DTB"
          sha256sum "$DTB"

      - name: 拉取 Mu-Silicium（固定版本）
        run: |
          git clone --no-checkout https://github.com/Project-Silicium/Mu-Silicium.git ../Mu-Silicium
          git -C ../Mu-Silicium checkout --detach "$MU_PIN"
          git -C ../Mu-Silicium submodule update --init --recursive
          echo "ACE5_MU=$(cd ../Mu-Silicium && pwd)" >> "$GITHUB_ENV"

      - name: Mu 的 Python 依赖
        run: |
          python3 -m venv local/mu-venv
          . local/mu-venv/bin/activate
          python3 -m pip install --upgrade pip
          python3 -m pip install -r "$ACE5_MU/pip-requirements.txt"
          echo "$PWD/local/mu-venv/bin" >> "$GITHUB_PATH"

      - name: 构建 ARM64 BaseTools
        run: python3 tools/ace5/prepare-linux-arm64.py "$ACE5_MU"

      - name: 构建诊断镜像（拒绝执行内核）
        run: tools/ace5/build-diagnostic.sh "$ACE5_MU" "$PWD/local/device/device.dtb"

      - name: 构建内核模式 loader
        run: |
          tools/ace5/build-loader.sh kernel
          python3 tools/ace5/pack-boot.py \
            --mu "$ACE5_MU" \
            --dtb "$PWD/local/device/device.dtb" \
            --stage kernel \
            --output out/giulia-kernel/hackios-giulia-kernel.img

      - name: 汇总产物
        run: |
          echo "=== 产物 ==="
          ls -l out/giulia/ out/giulia-kernel/ || true
          echo "=== SHA-256 ==="
          sha256sum out/giulia/*.img out/giulia-kernel/*.img 2>/dev/null || true
          echo "=== manifest ==="
          for f in out/giulia/*.json out/giulia-kernel/*.json; do
            [ -f "$f" ] && { echo "--- $f"; cat "$f"; echo; }
          done
          {
            echo "Mu pin: $MU_PIN"
            echo "DTB sha256: $(sha256sum local/device/device.dtb | cut -d' ' -f1)"
            sha256sum out/giulia/*.img out/giulia-kernel/*.img 2>/dev/null
          } > out/BUILD-INFO.txt || true

      - name: 上传诊断镜像
        uses: actions/upload-artifact@v4
        with:
          name: ace5-uefi-diagnostic
          path: |
            out/giulia/
            out/BUILD-INFO.txt
          if-no-files-found: error

      - name: 上传内核启动镜像
        uses: actions/upload-artifact@v4
        with:
          name: ace5-uefi-kernel
          path: |
            out/giulia-kernel/
            out/BUILD-INFO.txt
          if-no-files-found: error
